name: Release

# Runs on every vX.Y.Z tag push.
# Regenerates all go-FuSa safety artifacts (check, verify, qualify, fmea,
# safety-case, sbom, provenance, artifact-manifest) and commits them back to
# main so the committed files always reflect the exact state at each
# release. check/verify/qualify run before safety-case so safety-case's Sn1/
# Sn3/Sn4 evidence items reflect this release's actual results, not an
# absent-by-construction fallback.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to regenerate artifacts for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  regenerate-safety-artifacts:
    name: Regenerate safety artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install go-FuSa
        run: go install github.com/SoundMatt/go-FuSa/cmd/gofusa@v0.47.0

      # ── Core safety evidence (Sn1/Sn3/Sn4) ────────────────────────────────
      # gofusa safety-case reads check-report.json, .fusa-evidence.json, and
      # qualify-report.json to report whether this evidence exists — so it
      # must be generated here, in this job, before safety-case runs.
      # Previously these three steps were absent and safety-case fell back to
      # its own "absent" default, falsely declaring core evidence missing
      # for every tagged release even though CI's own gofusa job had already
      # generated and passed all three (go-mqtt#61).
      - name: "gofusa check (Sn1 evidence: coding-standard/static-analysis report)"
        run: gofusa check --format json --output check-report.json

      - name: "gofusa verify (Sn3 evidence: test evidence bundle)"
        run: gofusa verify

      - name: "gofusa qualify (Sn4 evidence: tool qualification report)"
        run: gofusa qualify

      - name: Regenerate dFMEA table
        run: gofusa fmea -cyber -strict

      - name: Regenerate component boundary diagram
        run: gofusa boundary

      - name: Regenerate SBOM, provenance, and artifact manifest
        run: gofusa release

      - name: Regenerate safety case
        run: gofusa safety-case

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit regenerated artifacts
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          git add -f fmea.csv fmea.json boundary.mermaid \
                     safety-case.json safety-case.md safety-case.mermaid \
                     sbom.json provenance.json artifact-manifest.json \
                     check-report.json .fusa-evidence.json qualify-report.json
          if git diff --cached --quiet; then
            echo "No artifact changes for $TAG — nothing to commit."
          else
            git commit -m "chore: regenerate safety artifacts for $TAG [skip ci]"
            git push origin HEAD:refs/heads/main
          fi
